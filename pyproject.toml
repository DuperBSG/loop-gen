[project]
name = "agent-loop"
version = "0.1.0"
description = "A plan-execute-critique-improve agent loop"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.scripts]
agent-loop = "main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "state", "llm", "config", "comfy"]
packages = ["agents"]
